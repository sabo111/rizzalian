<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rizzalian - Discover</title>
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/deck.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo"></div>

    <div class="nav-buttons">
      <div class="filter-wrapper">
        <button id="openFilterBtn" type="button" aria-haspopup="true" aria-expanded="false">Filter</button>

        <div class="filter-dropdown" id="filterDropdown" hidden>
          <form id="filterForm" class="filter-form">
            <div class="filter-grid">
              <label>
                Show me
                <select id="filterShow">
                  <option value="all">Everyone</option>
                  <option value="women">Women</option>
                  <option value="men">Men</option>
                </select>
              </label>
              <label>
                Program
                <input type="text" id="filterProgram" placeholder="e.g. Computer Engineering">
              </label>
              <label>
                Interests (comma separated)
                <input type="text" id="filterMeta" placeholder="e.g. gaming, music, python">
              </label>
            </div>
            <div class="filter-actions">
              <button type="submit" class="apply-btn">Apply</button>
              <button type="button" class="clear-btn" id="clearFilter">Clear</button>
            </div>
          </form>
        </div>
      </div>
      <button id="logoutBtn" type="button">Logout</button>
    </div>
  </nav>

  <main class="deck-area">
    <div class="deck" id="deck"></div>

    <div class="deck-empty" id="deckEmpty" hidden>
      <h2>You're all caught up</h2>
      <p>No more profiles right now. Check back later or loosen your filters.</p>
    </div>

    <div class="deck-actions" id="deckActions">
      <button id="passBtn" class="circle-btn pass" type="button" aria-label="Pass">✕</button>
      <button id="infoBtn" class="circle-btn info" type="button" aria-label="View details">i</button>
      <button id="likeBtn" class="circle-btn like" type="button" aria-label="Like">♥</button>
    </div>
  </main>

  <!-- Profile details (tap a card or the "i" button) -->
  <div class="user-panel" id="userPanel">
    <div class="panel-container">
      <div class="panel-header">
        <button class="close-btn" id="closePanel" type="button">✖</button>
      </div>
      <div class="user-main">
        <div class="profile-section">
          <img id="panelMainImg" class="main-photo" src="" alt="User">
        </div>
        <h2 id="panelName"></h2>
      </div>
      <div class="user-details" id="userDetails"></div>
      <div class="looking-for-section">
        <h3 class="section-title">Looking For</h3>
        <p class="looking-for-text" id="lookingFor"></p>
      </div>
    </div>
  </div>

  <!-- It's a match -->
  <div class="match-overlay" id="matchOverlay" hidden>
    <div class="match-box">
      <h2>It's a match! 💛</h2>
      <p id="matchText"></p>
      <div class="match-buttons">
        <button id="matchKeep" type="button">Keep swiping</button>
        <button id="matchChat" type="button" class="primary">Go to chat</button>
      </div>
    </div>
  </div>

  <footer class="footer-nav">
    <button class="nav-btn" onclick="window.location.href='../pages/home.html'">
      <img src="../assets/home.png" alt="Home">
    </button>
    <button class="nav-btn" onclick="window.location.href='../pages/matches.html'" aria-label="Matches">
      <span style="font-size:26px;line-height:1">💬</span>
    </button>
    <button class="nav-btn" onclick="window.location.href='../pages/myaccount.html'">
      <img src="../assets/profile.png" alt="Profile">
    </button>
    <button class="nav-btn" id="statsNavBtn" style="display:none" onclick="window.location.href='../pages/statistics.html'">
      <img src="../assets/stats.png" alt="Statistics">
    </button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/home.js"></script>
  <script src="../js/nav.js"></script>
</body>
</html>
