<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rizzalian - Statistics</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/statistics.css">
</head>
<body>
  <h1>Rizzalian Statistics</h1>

  <div class="chart-container"><canvas id="activeUsersChart"></canvas></div>
  <div class="chart-container"><canvas id="retentionChart"></canvas></div>
  <div class="chart-container"><canvas id="likesChart"></canvas></div>
  <div class="chart-container"><canvas id="matchesChart"></canvas></div>
  <div class="chart-container"><canvas id="gradYearChart"></canvas></div>
  <div class="chart-container"><canvas id="popularInterestsChart"></canvas></div>
  <div class="chart-container"><canvas id="interestSuccessChart"></canvas></div>
  <div class="chart-container"><canvas id="genderChart"></canvas></div>

  <!-- space so the fixed footer doesn't cover the last chart -->
  <div style="height: 100px"></div>

  <footer class="footer-nav">
    <button class="nav-btn" onclick="window.location.href='../pages/home.html'">
      <img src="../assets/home.png" alt="Home">
    </button>
    <button class="nav-btn" onclick="window.location.href='../pages/matches.html'" aria-label="Matches">
      <span style="font-size:26px;line-height:1">💬</span>
    </button>
    <button class="nav-btn" onclick="window.location.href='../pages/myaccount.html'">
      <img src="../assets/profile.png" alt="Profile">
    </button>
    <button class="nav-btn" onclick="window.location.href='../pages/statistics.html'">
      <img src="../assets/stats.png" alt="Statistics">
    </button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../js/statistics.js"></script>
</body>
</html>
